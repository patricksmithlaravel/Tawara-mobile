[workspace]
resolver = "3"
members = ["crates/mobile"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The wallet's licence (Tawara-wallet's docs/PLAN.md section 6): the Mochimo
# Cryptocurrency Engine License Agreement, version 1.0, the same file as
# Tawara-wallet's `LICENSE.md`, byte for byte. It has no SPDX identifier,
# which is why this is `license-file` and why deny.toml says how to read it.
license-file = "LICENSE.md"
# Nothing here is published to a registry; the apps ship as signed packages.
publish = false
repository = "https://github.com/patricksmithlaravel/Tawara-mobile"

[workspace.dependencies]
# THE APPLICATION, FROM TAWARA-WALLET, PINNED BY FULL COMMIT HASH
# (Tawara-wallet's docs/DECISIONS.md D33).
#
# `tawara-app` is the same iced application the desktop runs: every screen,
# the wallet's worker, and through `tawara-wallet-core` the library and every
# refusal it makes. This repository holds only what is mobile: the entry
# points, the platform glue and the platform files. A change the phones need
# in a screen, in the wallet's logic or in text that protects the user is
# made in Tawara-wallet and taken here by moving `rev`, and nothing else: no
# `[patch]`, `[replace]`, vendored copy or path override.
# `crates/mobile/tests/policy.rs` holds this line to a 40-hex `rev`.
#
# At f095432: Tawara-wallet#17's head, which is Tawara-wallet's `main` at
# 38dd452 with pull requests #16 and #17 on top (D32 item 9). #16 records the
# owner's decisions and adds the guard that keeps Return from broadcasting on
# phones and a Linux start-up check in CI; #17 moves the wallet's iced to the
# fork's release v0.14.1-mobile.2. 38dd452 carries pull requests #13 (phase 4
# (a)) and #15: `run_in(Host)` and `left_foreground`, which the shells call;
# the wipe of whatever secret is typed when the app leaves the foreground,
# before any further input; the `Leaving` the iOS shell waits on, done when
# the interface has taken the worker's answer to the move, or its `Stopped`,
# which comes after the queued commands are dropped; and stores kept inside
# the private folder (D32 items 6 and 7). Once #16 and #17 merge, the pin is
# #17's merge commit on `main`, as D32 item 9 (c) asks.
tawara-app = { git = "https://github.com/patricksmithlaravel/Tawara-wallet", rev = "f095432ed0e4143e186834041fac07bb71fd4732" }

# THE SHELLS' GLUE (Tawara-wallet's docs/DECISIONS.md D32), each on its own
# platform.
#
# `iced_winit` comes from the owner's iced fork at the commit Tawara-wallet
# pins for `iced` (D32 items 1, 8 and 9), so the build holds one copy of every
# iced crate, and one winit with them; the policy test holds the lockfile to
# it. Android: the fork's `set_android_app` and `on_lifecycle`, winit's
# NativeActivity backend, which the `android-native-activity` feature turns on,
# and JNI for the clipboard and Back. The backend is chosen by that feature
# rather than by feature unification, because exactly one android-activity
# backend must be on. iOS: the fork puts winit's window in UIKit's window
# scene; the shell uses the versions winit 0.30.13 already links, for the
# pasteboard, the app-switcher cover, the store's protection class and its
# backup exclusion. No Java, Kotlin, Swift or Objective-C source (D4).
#
# winit has no line of its own. It is the fork's vendored copy, reached as
# `iced_winit::winit`, and a crates.io winit beside it would be a second copy
# of winit in the build (D32 item 9 (b)).
iced_winit = { git = "https://github.com/patricksmithlaravel/iced_mobile", rev = "d4ab3a057db96162b087a27dd0752a3b15abfa6b", default-features = false, features = ["android-native-activity"] }
jni = "0.22.4"
ndk-context = "0.1.1"
objc2 = "0.5.2"
block2 = "0.5.1"
objc2-foundation = { version = "0.2.2", features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSPathUtilities",
    "NSString",
    "NSThread",
    "NSURL",
    "NSValue",
    "block2",
] }
objc2-ui-kit = { version = "0.2.2", features = [
    "block2",
    "UIApplication",
    "UIColor",
    "UIPasteboard",
    "UIResponder",
    "UIScene",
    "UIView",
    "UIWindow",
    "UIWindowScene",
] }

# The policy test's only dependency: it reads the manifests and the lockfile.
toml = "0.9"

# THE RELEASE PROFILE IS A SECURITY PROPERTY OF THE LIBRARY, AND PROFILES ARE
# ONLY READ FROM THE ROOT OF THE WORKSPACE BEING BUILT. Neither the library's
# nor Tawara-wallet's `[profile.release]` reaches a build of this repository:
# they are restated here or silently lost.
#
# `panic = "unwind"`: every scrub of key material in mochimo-crypto runs
# through `Drop` (`zeroize`, `Zeroizing`, `Secret`). Under `panic = "abort"`
# destructors do not run, so the master seed would stay in memory on exactly
# the path where it matters most.
#
# `overflow-checks = true`: cargo turns them off in release by default, so a
# bare `+` on a balance would wrap silently in the build users run.
#
# `crates/mobile/tests/policy.rs` fails if either line changes.
[profile.release]
panic = "unwind"
overflow-checks = true
