[package]
name = "tawara-mobile"
description = "The Tawara entry points for Android and iOS."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
# Android loads this crate as `libtawara_mobile.so`, built with
# `cargo rustc --crate-type cdylib` for each Android target
# (`platform/android/tawara.sh build`), so the workspace's own builds make no
# shared library they do not need.
crate-type = ["lib"]

[[bin]]
# iOS: the app bundle's executable. winit calls `UIApplicationMain` from it,
# so it must be the process's `main` (Tawara-wallet's
# docs/spikes/P1-REPORT.md). Elsewhere it says it is for iOS and stops.
name = "tawara"
path = "src/main.rs"

[dependencies]
tawara-app.workspace = true
# The QR reader behind the Android scanner (docs/DECISIONS.md D42 item 3). It is
# not named under a target: the scanner's decoding is compiled and tested on the
# host too (`src/qr.rs`).
rqrr.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# winit is not named here: the fork's copy comes through `iced_winit`, as
# `iced_winit::winit`, and a crates.io winit beside it would be a second copy
# of winit in the build (D32 item 9 (b)).
iced_winit.workspace = true
jni.workspace = true
ndk-context.workspace = true
# The Android entry calls `_exit`, which ends the process without the C
# library's exit handlers (D32 item 9 (j)). The policy test names libc among
# the mobile crate's dependencies.
libc.workspace = true
# The camera and its image reader, for the QR scanner (D42 item 3), with the
# `media` feature set in the workspace line. Android only: it does not compile
# for any other target.
ndk-sys.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation.workspace = true
objc2-ui-kit.workspace = true

[dev-dependencies]
toml.workspace = true
