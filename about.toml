# cargo-about's configuration for THIRD-PARTY-NOTICES.txt. ci/notices.sh reads
# it from the repository root. Why the notices are generated in CI and
# committed, and not uploaded, is Tawara-wallet's docs/DECISIONS.md D35; this
# file records how the graph is read for that decision.
#
# A checksum below pins the bytes of a licence file. When the file changes,
# cargo-about logs a mismatch and falls back to whatever text it finds in the
# crate, and it still exits with status 0 under --fail. A stale checksum
# therefore changes the notices without failing the run, and the byte
# comparison in `ci/notices.sh --check` is what catches it (Tawara-wallet's
# D35, item 4).

# The licences the notices may name: deny.toml's allow list, the same ten
# identifiers in the same order. Two exceptions are made below, each for named
# crates only: OFL-1.1 for tawara-app's fonts, and the Mochimo licence for the
# library and Tawara's crates (Tawara-wallet's D35, items 3 and 6 (d)). The
# policy test in crates/mobile/tests/policy.rs holds this list equal to
# deny.toml's and the exceptions to a table of its own, so the notices cannot
# carry a licence the policy gate has not admitted. With --fail, which
# ci/notices.sh passes, a crate under any other licence stops the run rather
# than dropping out of the notices.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
]

# The targets whose graph the notices describe: the two Android ABIs that the
# APK carries (TARGETS in platform/android/tawara.sh) and the iOS device build
# (`device` in platform/ios/tawara.sh). The policy test reads both scripts and
# holds this list to them. cargo-about takes the union of the targets, so one
# file covers all three. The simulator target is not shipped and is not listed.
# Adding it was checked, and it leaves the output unchanged.
#
# FEATURES. ci/notices.sh runs the generator without --all-features, so the
# graph is the one the default features give. That is the graph the shipped
# builds have: neither platform script passes --features or
# --all-features to cargo, and the workspace's own crates declare no features.
# A build script that starts passing features has to pass them here too.
targets = ["aarch64-linux-android", "x86_64-linux-android", "aarch64-apple-ios"]

# Dev-dependencies run in tests and in no shipped binary, so they are left out.
# Build dependencies run on the machine that builds the application, which is
# code the build carries, so they are kept. Transitive dependencies are kept
# too: an application carries every package it links, not only the ones it
# names directly.
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false

# cargo-about's own reading of chrono 0.4.x, which keeps the MIT and the
# Apache-2.0 texts in one file. Without it, chrono's MIT text would fall back to
# the canonical text, which has no copyright line. The workaround applies only
# to the chrono release whose file it recognises, by checksum. If a later chrono
# changes that file, the text falls back again, the notices change, and the
# check job's byte comparison fails.
workarounds = ["chrono"]

