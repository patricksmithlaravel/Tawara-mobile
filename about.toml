# malloc_buf 0.0.6 was published before its repository had a licence file, and
# without a `.cargo_vcs_info.json`. The repository added LICENSE, MIT and naming
# Steven Sheldon, in commit d9a3e539 ("Add LICENSE"), which says it states the
# licence the crate was published under. That commit is named here, since
# cargo-about cannot find one in the package.

[malloc_buf]

[malloc_buf.clarify]
license = "MIT"
override-git-commit = "d9a3e539642bd90e07df458d226b19cdfa606863"

[[malloc_buf.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "aced7b57e474a63edb5a724954222bf7659c01ceef0e648a03af799582991db7"

# The Objective-C crates of the objc2 repository. Up to objc2 0.5 the repository
# kept LICENSE.txt, MIT and naming Steven Sheldon, and the versions published
# from those commits take it. From objc2 0.6 the repository keeps LICENSE.md
# instead, which states the licences and has no licence text; objc2 0.6.4 and
# objc2-foundation 0.3.2 have no LICENSE.txt at their commits, so the
# clarification fails for them, with one warning each, and they keep the
# standard text, as do objc2-encode 4.1.0, the other objc2 0.3 framework
# crates, block 0.1.6 and dispatch 0.2.0.

[block2]

[block2.clarify]
