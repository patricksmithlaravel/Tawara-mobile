# THE COPYRIGHT HOLDERS (Tawara-wallet's D35, item 6 (a)). The MIT, ISC and BSD
# licences ask for the copyright notice to go with the software, so each crate
# under one of them is given the text that names its holder, wherever the crate
# publishes one. cargo-about reads a package's licence files only under the
# names it recognises. Where it finds none, it prints the licence's standard
# text, whose copyright line is a template ("<year> <copyright holders>") and
# names nobody. The entries below give it the crate's own text instead:
#
# - `files`: a file the package carries under a name cargo-about does not read,
#   or a different file from the one it would pick;
# - `git`: a file in the crate's repository at the commit the package was
#   published from, which cargo-about reads from the package's
#   `.cargo_vcs_info.json` and fetches from raw.githubusercontent.com on every
#   run. The generator needs the network for these. A failed fetch only warns,
#   and the byte comparison in `ci/notices.sh --check` then fails.
#
# Every file is pinned by the SHA-256 of its text. A name covers every version
# of the crate in the graph, and a clarification that fails for one version
# leaves that version to the files in its package, with a warning.
#
# What is left. Some crates publish their licence with no copyright line, in
# the package and in the repository alike (most of dtolnay's and serde's
# crates, among others); their text is printed as published. Eight crate
# versions, all from SSheldon's and madsmtm's Objective-C crates, publish no
# text of their licence anywhere; they get the standard text, from which
# ci/notices.sh removes the template line (Tawara-wallet's D35, item 2), and the
# policy test lists them. The template names the authors from each crate's
# metadata beside every crate, and says that they are not necessarily the
# holders.

# libm keeps its licence, the MIT text and the copyright lines of its sources
# (Jorge Aparicio's, and musl's), in one LICENSE.txt, which cargo-about does
# not match to any one licence, and so passes over.

[libm]

[libm.clarify]
license = "MIT"

[[libm.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"

# cfg_aliases ships NOTICES.md, a note on code taken from tectonic_cfg_support,
